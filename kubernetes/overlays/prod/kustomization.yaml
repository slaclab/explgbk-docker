namespace: cryoem-logbook

# Operators are not part of this overlay. The Percona operator is installed from
# kubernetes/prod-operators/mongo (psmdb-operator namespace) and applied separately.
bases:
- ../../base/

resources:
- ns.yaml
- mongo-database.yaml
- kafka-messagebus.yaml
- kafka-metrics.yaml
- ingress.yaml
- cryoem-storage.yaml
- mongodump.yaml
- backup-deployment.yaml

patchesStrategicMerge:
- auth-patches.yaml
- logbook-patches.yaml
- collab-listener-patches.yaml

secretGenerator:
- name: mongodb
  literals:
  - username=admin
  - password=somepassword
- name: explgbk-writer
  literals:
  - username=writer
  - password=somepassword
- name: explgbk-reader
  literals:
  - username=reader
  - password=somepassword
- name: auth-secrets
  files:
  - ./etc/.secrets/cert.crt
  - ./etc/.secrets/intermediates.cer
  - ./etc/.secrets/cert.key
  - ./etc/.secrets/keytab_webauth
  - ./etc/.secrets/backend.htpasswd
- name: collab-listener
  literals:
  - username=cryo-daq
  files:
  - password=./etc/.secrets/collab-listener.password

# mongodump-script (for the CronJob in mongodump-cronjob.yaml) is not on live prod; see that file.

# Tags match what is running in prod (sdf-k8s01, vcluster cryoem, ns cryoem-logbook) as of 2026-11-06.
images:
- name: slaclab/explgbk-docker
  newTag: '20240112.0.0'
- name: slaclab/explgbk-auth
  newTag: '20260901.3'
- name: slaclab/explgbk-collab-listener
  newTag: '20201019.1'
