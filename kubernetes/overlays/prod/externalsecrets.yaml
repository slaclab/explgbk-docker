# Secrets for the prod logbook, pulled from Vault by the host cluster's External
# Secrets Operator (ClusterSecretStore cryoem-cryoem, enabled in alpastor).
# Vault entry: secret/cryoem/cryoem/logbook. Each target name is fixed (no
# kustomize hash suffix) and is referenced literally by the base Deployments.
#
# ESO refreshes the Secrets every hour, but the pods read them only at start:
# after changing a value in Vault, run `kubectl rollout restart` on the
# Deployment that uses it.

# Apache/WebAuth front end (base/auth.yaml, volume auth-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cryoem-cryoem
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
  data:
  - secretKey: cert.crt
    remoteRef:
      key: cryoem/cryoem/logbook
      property: cert.crt
  - secretKey: cert.key
    remoteRef:
      key: cryoem/cryoem/logbook
      property: cert.key
  - secretKey: intermediates.cer
    remoteRef:
      key: cryoem/cryoem/logbook
      property: intermediates.cer
  # Binary keytab, stored in Vault as base64 text.
  - secretKey: keytab_webauth
    remoteRef:
      key: cryoem/cryoem/logbook
      property: keytab_webauth.encoded
      decodingStrategy: Base64
  - secretKey: backend.htpasswd
    remoteRef:
      key: cryoem/cryoem/logbook
      property: backend.htpasswd

---
# collab-listener's logbook (Basic auth) account; the username is fixed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collab-listener
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cryoem-cryoem
    kind: ClusterSecretStore
  target:
    name: collab-listener
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: cryo-daq
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: cryoem/cryoem/logbook
      property: collab-listener.password

---
# explgbk's MongoDB read/write account (MONGODB_USERNAME/PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: explgbk-writer
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cryoem-cryoem
    kind: ClusterSecretStore
  target:
    name: explgbk-writer
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: cryoem/cryoem/logbook
      property: explgbk-writer.username
  - secretKey: password
    remoteRef:
      key: cryoem/cryoem/logbook
      property: explgbk-writer.password

---
# explgbk's ROLES_DATABASE_USER/PASSWORD env (base/logbook.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: explgbk-reader
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cryoem-cryoem
    kind: ClusterSecretStore
  target:
    name: explgbk-reader
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: cryoem/cryoem/logbook
      property: explgbk-reader.username
  - secretKey: password
    remoteRef:
      key: cryoem/cryoem/logbook
      property: explgbk-reader.password
