# Toolbox for manual logical dumps (mongodump-by-db.sh) to the mongo-restore-logic PVC.
# Matches the live Deployment (no mongo-ssl mount) as of 2026-11-10.
# The scheduled CronJob is in mongodump-cronjob.yaml and is NOT deployed on prod.
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: mongo-restore-logic
spec:
  storageClassName: wekafs--sdf-k8s01
  # Live is ReadWriteOnce (access modes can't be changed on an existing PVC).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1000Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-logic-backup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-restore
  template:
    metadata:
      labels:
        app: mongo-restore
    spec:
      containers:
      - name: mongo-restore
        image: mongo:5.0
        command: [ "bash", "-c", "sleep infinity" ]
        volumeMounts:
        - mountPath: /data
          name: mongo-restore
      - name: scp
        image: kroniak/ssh-client
        command:  [ "bash", "-c", "sleep infinity" ]
        volumeMounts:
        - mountPath: /data
          name: mongo-restore
      volumes:
      - name: mongo-restore
        persistentVolumeClaim:
          claimName: mongo-restore-logic
