---

# Same as prod: TLS passes through to the Apache auth front end, which serves
# WebAuth on /lgbk/ and HTTP Basic on /cryoem-data/ (Airflow and other service accounts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  ingressClassName: nginx
  rules:
    - host: cryoem-logbook-dev.slac.stanford.edu
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: auth
              port:
                number: 443
