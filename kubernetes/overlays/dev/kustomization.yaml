# Dev logbook: the prod stack (explgbk + Apache/WebAuth auth front end) on the
# cryoem-logbook-dev vcluster, namespace dev, as a staging copy of prod.
#
# - App image: the prod reproduction built by .github/workflows/docker_publish.yml.
# - Data layer: reuses dev's existing Percona MongoDB (mongo/, applied separately)
#   and Strimzi Kafka. Nothing here creates or changes Mongo, Kafka or operators.
# - collab-listener is left out: it runs setfacl on real experiment directories
#   and talks to the prod logbook.
#
# Apply with `make apply` (refuses any other kube context).

namespace: dev

resources:
- ../../base/
- ingress.yaml
- externalsecrets.yaml

patches:
- path: logbook-patches.yaml
- path: collab-listener-delete.yaml

# Secrets come from Vault through External Secrets Operator (externalsecrets.yaml),
# with fixed names: auth-secrets, explgbk-writer.

images:
- name: slaclab/explgbk-docker
  newName: ghcr.io/slaclab/explgbk-docker
  newTag: '20261110-1826'
# Same auth image as prod (built outside this repo).
- name: slaclab/explgbk-auth
  newTag: '20260901.3'
