# Secrets for the dev logbook, pulled from Vault by the host cluster's External
# Secrets Operator (ClusterSecretStore cryoem-cryoem-logbook-dev, enabled in
# alpastor). Vault entry: secret/cryoem/cryoem-logbook-dev/logbook. Each target
# name is fixed (no kustomize hash suffix) and is referenced literally by the
# base Deployments.
#
# ESO refreshes the Secrets every hour, but the pods read them only at start:
# after changing a value in Vault, run `kubectl rollout restart` on the
# Deployment that uses it.

# Apache/WebAuth front end (base/auth.yaml, volume auth-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cryoem-cryoem-logbook-dev
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
  data:
  - secretKey: cert.crt
    remoteRef:
      key: cryoem/cryoem-logbook-dev/logbook
      property: cert.crt
  - secretKey: cert.key
    remoteRef:
      key: cryoem/cryoem-logbook-dev/logbook
      property: cert.key
  - secretKey: intermediates.cer
    remoteRef:
      key: cryoem/cryoem-logbook-dev/logbook
      property: intermediates.cer
  # Binary keytab, stored in Vault as base64 text.
  - secretKey: keytab_webauth
    remoteRef:
      key: cryoem/cryoem-logbook-dev/logbook
      property: keytab_webauth.encoded
      decodingStrategy: Base64
  - secretKey: backend.htpasswd
    remoteRef:
      key: cryoem/cryoem-logbook-dev/logbook
      property: backend.htpasswd

---
# explgbk's MongoDB account (MONGODB_USERNAME/PASSWORD). Dev has no reader
# account; logbook-patches.yaml drops the ROLES_DATABASE_* env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: explgbk-writer
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cryoem-cryoem-logbook-dev
    kind: ClusterSecretStore
  target:
    name: explgbk-writer
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: cryoem/cryoem-logbook-dev/logbook
      property: explgbk-writer.username
  - secretKey: password
    remoteRef:
      key: cryoem/cryoem-logbook-dev/logbook
      property: explgbk-writer.password
