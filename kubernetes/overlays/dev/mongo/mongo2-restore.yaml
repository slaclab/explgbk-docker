## Same-cluster PITR restore for mongo2 (sharded)
## Usage:
##   1. Update backupName to the base backup (physical or logical)
##   2. Update pitr.date to the target restore time (format: "YYYY-MM-DD HH:MM:SS")
##   3. Change metadata.name to a unique name for each restore attempt
##   4. kubectl apply -f mongo2-restore.yaml
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDBRestore
metadata:
  name: restore-mongo2-pitr
  namespace: dev
spec:
  clusterName: mongo2
  backupName: backup-mongo2-logical  # or backup-mongo2-sharded-base (physical)
  pitr:
    type: date
    date: "2026-04-29 03:26:00"  # must be within PITR oplog range
