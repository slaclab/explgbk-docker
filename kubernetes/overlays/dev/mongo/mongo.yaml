apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongo
  namespace: dev
spec:
  crVersion: 1.22.0
  tls:
    mode: preferTLS
  unsafeFlags:
    tls: false
  image: percona/percona-server-mongodb:8.0.19-7
  backup:
    enabled: true
    image: percona/percona-backup-mongodb:2.12.0
    startingDeadlineSeconds: 43200
    pitr:
      compressionLevel: 6
      compressionType: gzip
      enabled: true
      oplogSpanMin: 10
    tasks:
    - name: mongo-nightly-logical-backup
      enabled: true
      schedule: "0 3 * * *"
      keep: 7
      storageName: minio
      type: logical
      compressionType: gzip
      compressionLevel: 6
    storages:
      minio:
        s3:
          bucket: cryoem-logbook-mongodb-backup
          credentialsSecret: mongo-backup-s3
          endpointUrl: https://s3dfrgw.slac.stanford.edu
          region: Default
          prefix: cryoem/dev/mongo-cluster
        type: s3
  replsets:
  - affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
    name: rs0
    size: 3
    shareProcessNamespace: true  # <-- enables sidecar to see mongod PID
    sidecars:
    - name: nofile-bumper
      image: busybox:1.36          # any image with util-linux/prlimit
      securityContext:
        capabilities:
          add: ["SYS_RESOURCE"]
      command:
      - /bin/sh
      - -c
      - |
        # Wait for mongod to come up, then bump its rlimits.
        # Re-run periodically in case mongod restarts (StatefulSet pod stays).
        while true; do
          PID=$(pidof mongod || true)
          if [ -n "$PID" ]; then
            prlimit --pid "$PID" --nofile=1048576:1048576 || true
          fi
          sleep 2
        done
    containerSecurityContext:
      privileged: false
      capabilities:
        add:
          - SYS_RESOURCE
    hookScript:
      script: |
        #!/bin/bash
        # Raise nofile before mongod is exec'd. Requires CAP_SYS_RESOURCE (granted above).
        ulimit -n 1048576 2>/dev/null || ulimit -n 524288 2>/dev/null || ulimit -n 262144 2>/dev/null || true
        echo "[hookScript] nofile soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
    configuration: |
      storage:
        wiredTiger:
          engineConfig:
            cacheSizeGB: 16
            configString: "file_manager=(close_idle_time=600,close_scan_interval=60,close_handle_minimum=2000)"
          collectionConfig:
            blockCompressor: snappy
          indexConfig:
            prefixCompression: true
    livenessProbe: # when to kill/restart
      failureThreshold: 10         # default 4 - how many failures before restart
      initialDelaySeconds: 7200    # default 60 - wait before first probe
      periodSeconds: 360           # default 30 - how often to probe
      timeoutSeconds: 10           # default 5 - probe timeout
      startupDelaySeconds: 7200    # default 7200 - startup grace period
    readinessProbe:  #when to put into traffic
    resources:
      limits:
        cpu: "8"
        memory: "16Gi"
      requests:
        cpu: "4"
        memory: "16Gi"
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 320Gi
  sharding:
    enabled: true
    configsvrReplSet:
      configuration: |
        storage:
          wiredTiger:
            engineConfig:
              cacheSizeGB: 2
              configString: "file_manager=(close_idle_time=600,close_scan_interval=60,close_handle_minimum=500)"
      containerSecurityContext:
        capabilities:
          add:
          - SYS_RESOURCE
      shareProcessNamespace: true  # <-- enables sidecar to see mongod PID
      sidecars:
      - name: nofile-bumper
        image: busybox:1.36          # any image with util-linux/prlimit
        securityContext:
          capabilities:
            add: ["SYS_RESOURCE"]
        command:
        - /bin/sh
        - -c
        - |
          # Wait for mongod to come up, then bump its rlimits.
          # Re-run periodically in case mongod restarts (StatefulSet pod stays).
          while true; do
            PID=$(pidof mongod || true)
            if [ -n "$PID" ]; then
              prlimit --pid "$PID" --nofile=1048576:1048576 || true
            fi
            sleep 2
          done
      hookScript:
        script: |
          #!/bin/bash
          ulimit -n 1048576 2>/dev/null || ulimit -n 524288 2>/dev/null || ulimit -n 262144 2>/dev/null || true
          echo "[hookScript] nofile soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
      livenessProbe:
        failureThreshold: 10
        initialDelaySeconds: 120
        periodSeconds: 30
        startupDelaySeconds: 7200
        timeoutSeconds: 30
      readinessProbe:
        failureThreshold: 10
        initialDelaySeconds: 3
        periodSeconds: 30
        timeoutSeconds: 10
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
        requests:
          cpu: "1"
          memory: 4Gi
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 3Gi
    mongos:
      containerSecurityContext:
        capabilities:
          add:
          - SYS_RESOURCE
      shareProcessNamespace: true  # <-- enables sidecar to see mongod PID
      sidecars:
      - name: nofile-bumper
        image: busybox:1.36          # any image with util-linux/prlimit
        securityContext:
          capabilities:
            add: ["SYS_RESOURCE"]
        command:
        - /bin/sh
        - -c
        - |
          # Wait for mongod to come up, then bump its rlimits.
          # Re-run periodically in case mongod restarts (StatefulSet pod stays).
          while true; do
            PID=$(pidof mongod || true)
            if [ -n "$PID" ]; then
              prlimit --pid "$PID" --nofile=1048576:1048576 || true
            fi
            sleep 2
          done
      hookScript:
        script: |
          #!/bin/bash
          ulimit -n 1048576 2>/dev/null || ulimit -n 524288 2>/dev/null || ulimit -n 262144 2>/dev/null || true
          echo "[hookScript] nofile soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
      livenessProbe:
        failureThreshold: 6
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
      readinessProbe:
        failureThreshold: 8
        initialDelaySeconds: 3
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
      size: 3
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
    schedule: 0 2 * * *
    setFCV: false
