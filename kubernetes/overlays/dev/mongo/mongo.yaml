apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongo
  namespace: dev
spec:
  crVersion: 1.22.0
  #image: percona/percona-server-mongodb:5.0.22-19
  #image: percona/percona-server-mongodb:6.0.27-21
  #image: percona/percona-server-mongodb:7.0.30-16
  image: percona/percona-server-mongodb:8.0.19-7
  replsets:
  - affinity:
      antiAffinityTopologyKey: kubernetes.io/hostname
    name: rs0
    size: 3
    containerSecurityContext:
      privileged: false
      capabilities:
        add:
          - SYS_RESOURCE
    configuration: |
      storage:
        wiredTiger:
          engineConfig:
            cacheSizeGB: 16
          collectionConfig:
            blockCompressor: snappy
          indexConfig:
            prefixCompression: true
    livenessProbe: # when to kill/restart
      failureThreshold: 10         # default 4 - how many failures before restart
      initialDelaySeconds: 7200    # default 60 - wait before first probe
      periodSeconds: 360           # default 30 - how often to probe
      timeoutSeconds: 10           # default 5 - probe timeout
      startupDelaySeconds: 7200    # default 7200 - startup grace period
    readinessProbe:  #when to put into traffic
    resources:
      limits:
        cpu: "8"
        memory: "16Gi"
      requests:
        cpu: "4"
        memory: "16Gi"
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 320Gi
  sharding:
    enabled: true
    configsvrReplSet:
      configuration: |
        storage:
          wiredTiger:
            engineConfig:
              cacheSizeGB: 2
      containerSecurityContext:
        capabilities:
          add:
          - SYS_RESOURCE
      livenessProbe:
        failureThreshold: 10
        initialDelaySeconds: 120
        periodSeconds: 30
        startupDelaySeconds: 7200
        timeoutSeconds: 30
      readinessProbe:
        failureThreshold: 10
        initialDelaySeconds: 3
        periodSeconds: 30
        timeoutSeconds: 10
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
        requests:
          cpu: "1"
          memory: 4Gi
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 3Gi
    mongos:
      livenessProbe:
        failureThreshold: 6
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 10
      readinessProbe:
        failureThreshold: 8
        initialDelaySeconds: 3
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
      size: 3
  updateStrategy: SmartUpdate
  upgradeOptions:
    apply: disabled
    schedule: 0 2 * * *
    setFCV: false
